<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Game Shop</title>
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <main class="home-page">
      <section class="hero">
        <p class="eyebrow">Game catalog prototype</p>
        <h1>Agentic Game Shop</h1>
        <p class="summary">
          Browse the first games in the shop catalog.
        </p>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="section-header">
          <p class="eyebrow">Available games</p>
          <h2 id="catalog-title">Catalog</h2>
        </div>

        <div class="game-grid">
          <a class="game-card" href="/games/item01" aria-label="View Game 01 details">
            <img src="/assets/games/item01.jpg" alt="Game 01 cover art">
            <span class="game-card-content">
              <span class="game-title">Game 01</span>
              <span class="game-meta">Details coming soon</span>
            </span>
          </a>

          <a class="game-card" href="/games/item02" aria-label="View Game 02 details">
            <img src="/assets/games/item02.jpg" alt="Game 02 cover art">
            <span class="game-card-content">
              <span class="game-title">Game 02</span>
              <span class="game-meta">Details coming soon</span>
            </span>
          </a>

          <a class="game-card" href="/games/item03" aria-label="View Game 03 details">
            <img src="/assets/games/item03.jpg" alt="Game 03 cover art">
            <span class="game-card-content">
              <span class="game-title">Game 03</span>
              <span class="game-meta">Details coming soon</span>
            </span>
          </a>

          <a class="game-card" href="/games/item04" aria-label="View Game 04 details">
            <img src="/assets/games/item04.jpg" alt="Game 04 cover art">
            <span class="game-card-content">
              <span class="game-title">Game 04</span>
              <span class="game-meta">Details coming soon</span>
            </span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
